name: Build Windows EXE

# Ne zaman calisir:
#   - main dalina her push'ta          -> exe'yi derler, "Actions" sekmesinde
#                                          indirilebilir artifact olarak birakir
#   - "v1.0" gibi bir surum tag'i push'landiginda -> ayrica otomatik bir
#                                          GitHub Release olusturup exe'yi
#                                          o release'e ekler
#   - Actions sekmesinden elle de tetiklenebilir (workflow_dispatch)
"on":
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: pyinstaller --noconfirm --onefile --windowed --name "MOAudioWaveformAnalyzer" --icon "assets/app_icon.ico" --version-file "version_info.txt" --add-data "assets;assets" waveform_analyzer.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOAudioWaveformAnalyzer-windows
          path: dist/MOAudioWaveformAnalyzer.exe

      - name: Create GitHub Release (only for version tags, e.g. v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MOAudioWaveformAnalyzer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
